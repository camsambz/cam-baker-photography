<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>CAM BAKER Photography</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:Arial,sans-serif;color:#fff}
header{background:#000;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;position:fixed;width:100%;top:0;z-index:1000}
header h1{font-size:24px}
nav a{color:#fff;margin-left:30px;text-decoration:none}
.hero{margin-top:80px;display:flex;height:600px;position:relative}
.hero video{flex:1;object-fit:cover}
.hero-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:10}
.hero-overlay h1{font-size:48px;margin:0}
.hero-overlay p{font-size:14px;margin-top:10px;font-style:italic}
.gallery{padding:40px;background:#000}
.gal-item{margin-bottom:40px}
.gal-full{width:100%}
.gal-full img{width:100%;height:400px;object-fit:cover}
.gal-row{display:flex;gap:15px;margin-bottom:40px}
.gal-row > div{flex:1}
.gal-row img{width:100%;height:500px;object-fit:cover}
.gal-label{background:#111;padding:8px;text-align:center;font-size:12px;color:#999;margin-top:5px}
</style>
</head>
<body>
<header>
<h1>CAM BAKER</h1>
<nav>
<a href="#portfolio">PORTFOLIO</a>
<a href="#contact">CONTACT</a>
</nav>
</header>
<section class="hero">
<video autoplay muted loop><source src="video1_small.mp4"></video>
<video autoplay muted loop><source src="video2_small.mp4"></video>
<video autoplay muted loop><source src="video3_small.mp4"></video>
<div class="hero-overlay">
<h1>PHOTOGRAPHY</h1>
<p>Capturing moments, creating stories</p>
</div>
</section>
<section class="gallery" id="gallery"></section>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const photos = [
    {src: 'Ana L 2026.1.jpg', label: 'Ana L 2026.1', type: 'landscape'},
    {src: 'Ana V 2026.1.jpg', label: 'Ana V 2026.1', type: 'vertical'},
    {src: 'Ana V 2026.2.jpg', label: 'Ana V 2026.2', type: 'vertical'},
    {src: 'Ana V 2026.3.jpg', label: 'Ana V 2026.3', type: 'vertical'},
    {src: 'Ana L 2026.3.jpg', label: 'Ana L 2026.3', type: 'landscape'},
    {src: 'Ana V 2026.4.jpg', label: 'Ana V 2026.4', type: 'vertical'},
    {src: 'Ana V 2026.5.jpg', label: 'Ana V 2026.5', type: 'vertical'},
    {src: 'Ana V 2026.6.jpg', label: 'Ana V 2026.6', type: 'vertical'},
    {src: 'Ana L 2026.4.jpg', label: 'Ana L 2026.4', type: 'landscape'}
  ];
  
  const gallery = document.getElementById('gallery');
  let i = 0;
  
  while(i < photos.length){
    // Add landscape photo
    const item1 = document.createElement('div');
    item1.className = 'gal-item';
    item1.innerHTML = '<div class="gal-full"><img src="'+photos[i].src+'"><div class="gal-label">'+photos[i].label+'</div></div>';
    gallery.appendChild(item1);
    i++;
    
    // Add 3 vertical photos
    if(i < photos.length){
      const row = document.createElement('div');
      row.className = 'gal-row';
      for(let j=0; j<3 && i<photos.length; j++){
        const col = document.createElement('div');
        col.innerHTML = '<img src="'+photos[i].src+'"><div class="gal-label">'+photos[i].label+'</div>';
        row.appendChild(col);
        i++;
      }
      gallery.appendChild(row);
    }
  }
});
</script>
</body>
</html>
